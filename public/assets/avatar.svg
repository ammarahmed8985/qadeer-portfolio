<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1728"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  
  <!-- Card Background -->
  <rect width="400" height="480" rx="24" fill="url(#bg)"/>
  <rect x="2" y="2" width="396" height="476" rx="22" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Supervisor Silhouette -->
  <g fill="#1e293b" opacity="0.8">
    <!-- Head -->
    <circle cx="200" cy="180" r="60"/>
    <!-- Shoulders & Uniform -->
    <path d="M100,340 C100,270 140,260 200,260 C260,260 300,270 300,340 L300,420 L100,420 Z"/>
  </g>

  <!-- Hospital / Facility Cross Emblem on Uniform -->
  <circle cx="200" cy="330" r="28" fill="#0b1120" stroke="#0284c7" stroke-width="2"/>
  <rect x="195" y="314" width="10" height="32" rx="2" fill="#38bdf8"/>
  <rect x="184" y="325" width="32" height="10" rx="2" fill="#38bdf8"/>

  <!-- Monogram Initials "QA" -->
  <text x="200" y="192" font-family="sans-serif" font-size="34" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="2">QA</text>

  <!-- Verified Status Pill -->
  <rect x="110" y="40" width="180" height="32" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="128" cy="56" r="4" fill="#34d399"/>
  <text x="140" y="61" font-family="sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" letter-spacing="1.5">VERIFIED RECORD</text>

  <!-- Subtitle -->
  <text x="200" y="440" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="2">HOSPITAL &amp; FACILITIES SERVICES</text>
</svg>